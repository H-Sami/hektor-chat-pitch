# Publish all three refs together. Every deployment replaces the whole Pages site.
# / -> main; /demo-v2/ -> demo-v2; /hektor-demo/ -> hektor-demo-sv.
# Keep the workflow on main authoritative; manually dispatch using branch main.
name: Publish decks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # All decks are required: a checkout failure must not remove a live version.
      - name: Check out demo-v2
        uses: actions/checkout@v4
        with:
          ref: demo-v2
          path: demo-v2

      - name: Check out Swedish Hektor Demo
        uses: actions/checkout@v4
        with:
          ref: hektor-demo-sv
          path: hektor-demo-sv

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            demo-v2/package-lock.json
            hektor-demo-sv/package-lock.json

      - name: Build main deck at the site root
        working-directory: main
        run: |
          npm ci --ignore-scripts
          node node_modules/@slidev/cli/bin/slidev.mjs build slides.md \
            --out ../site --base /hektor-chat-pitch/

      - name: Build demo-v2
        working-directory: demo-v2
        run: |
          npm ci --ignore-scripts
          node node_modules/@slidev/cli/bin/slidev.mjs build slides.md \
            --out ../site/demo-v2 --base /hektor-chat-pitch/demo-v2/

      - name: Build Swedish Hektor Demo
        working-directory: hektor-demo-sv
        run: |
          npm ci --ignore-scripts
          node node_modules/@slidev/cli/bin/slidev.mjs build slides.md \
            --out ../site/hektor-demo --base /hektor-chat-pitch/hektor-demo/

      - name: Prepare PDF downloads and direct slide links
        run: node main/scripts/prepare-pages.mjs . site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
